version: '3.8'

services:
  # MySQL Databases
  mysql-usuarios:
    image: mysql:8.0
    container_name: mysql-usuarios
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fitlife_usuarios_db
    ports:
      - "3306:3306"
    networks:
      - fitlife-network
    volumes:
      - mysql-usuarios-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-reservas:
    image: mysql:8.0
    container_name: mysql-reservas
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fitlife_reservas_db
    ports:
      - "3307:3306"
    networks:
      - fitlife-network
    volumes:
      - mysql-reservas-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-pagos:
    image: mysql:8.0
    container_name: mysql-pagos
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fitlife_pagos_db
    ports:
      - "3308:3306"
    networks:
      - fitlife-network
    volumes:
      - mysql-pagos-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-notificaciones:
    image: mysql:8.0
    container_name: mysql-notificaciones
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fitlife_notificaciones_db
    ports:
      - "3309:3306"
    networks:
      - fitlife-network
    volumes:
      - mysql-notificaciones-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-locations:
    image: mysql:8.0
    container_name: mysql-locations
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fitlife_locations_db
    ports:
      - "3310:3306"
    networks:
      - fitlife-network
    volumes:
      - mysql-locations-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - fitlife-network
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # Microservicios
  ms-gateway:
    build:
      context: ./MS-gateway
      dockerfile: Dockerfile
    container_name: ms-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES=true
    networks:
      - fitlife-network
    depends_on:
      - ms-usuarios
      - ms-reservas
      - ms-gestion-pago
      - ms-notificaciones
      - ms-location
    restart: always

  ms-usuarios:
    build:
      context: ./MS-usuarios
      dockerfile: Dockerfile
    container_name: ms-usuarios
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-usuarios:3306/fitlife_usuarios_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    networks:
      - fitlife-network
    depends_on:
      mysql-usuarios:
        condition: service_healthy
    restart: always

  ms-reservas:
    build:
      context: ./MS-reservas
      dockerfile: Dockerfile
    container_name: ms-reservas
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-reservas:3306/fitlife_reservas_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    networks:
      - fitlife-network
    depends_on:
      mysql-reservas:
        condition: service_healthy
    restart: always

  ms-gestion-pago:
    build:
      context: ./MS-gestionPago
      dockerfile: Dockerfile
    container_name: ms-gestion-pago
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-pagos:3306/fitlife_pagos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    networks:
      - fitlife-network
    depends_on:
      mysql-pagos:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: always

  ms-notificaciones:
    build:
      context: ./MS-notificaciones
      dockerfile: Dockerfile
    container_name: ms-notificaciones
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-notificaciones:3306/fitlife_notificaciones_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    networks:
      - fitlife-network
    depends_on:
      mysql-notificaciones:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: always

  ms-location:
    build:
      context: ./MS-Location
      dockerfile: Dockerfile
    container_name: ms-location
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-locations:3306/fitlife_locations_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    networks:
      - fitlife-network
    depends_on:
      mysql-locations:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./FitlifeFront-Front/FitlifeFront-Front_version_2.7
      dockerfile: Dockerfile
    container_name: fitlife-frontend
    ports:
      - "3000:80"
    networks:
      - fitlife-network
    depends_on:
      - ms-gateway

networks:
  fitlife-network:
    driver: bridge

volumes:
  mysql-usuarios-data:
  mysql-reservas-data:
  mysql-pagos-data:
  mysql-notificaciones-data:
  mysql-locations-data:
  rabbitmq-data:
