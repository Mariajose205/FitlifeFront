name: Build and Deploy Fitlife-frontend

on:
  push:
    branches: [ main, develop, FrontendActualizado ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Build
        run: npm run build
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fitlife-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/fitlife-frontend:${{ github.sha }}
          timeout: 1800000

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/FrontendActualizado') && github.event_name == 'push'
    
    steps:
      - name: Deploy to EC2 Frontend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FRONTEND_EC2_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ec2-user
            cat > docker-compose.frontend.yml << 'EOF'
            version: '3.8'
            
            services:
              frontend:
                image: mariacarrero/fitlife-frontend:latest
                container_name: fitlife-frontend
                ports:
                  - "80:80"
                restart: always
            EOF
            docker compose -f docker-compose.frontend.yml pull
            docker compose -f docker-compose.frontend.yml up -d
            docker image prune -f
